[package]
name = "wg-basic-win32-sys"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false
description = "Audited Windows control surface for wg-basic: the single isolated unsafe OS boundary."
license = "MIT"

# Unsafe lives only in `ffi`. The main crate keeps `forbid(unsafe_code)`.
# Host builds of this crate are empty. Windows-only dependencies stay on the
# Windows target so a Linux `cargo test` does not build them.
[target.'cfg(windows)'.dependencies]
serde = { version = "1.0", features = ["derive"] }
wmi = "0.14"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_NetworkManagement_NetManagement",
] }

[lints.rust]
unsafe_code = "deny"
