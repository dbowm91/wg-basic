name: Distribution foundation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.89.0
      - name: Build pinned Eggpack validator
        run: |
          git clone --filter=blob:none https://github.com/eggstack/eggpack "$RUNNER_TEMP/eggpack"
          git -C "$RUNNER_TEMP/eggpack" checkout --detach d61ca71fc0112be63e7e8ba31ba8fa2b1ce5a628
          cargo build --locked --manifest-path "$RUNNER_TEMP/eggpack/Cargo.toml" -p eggpack-cli --bin eggpack
      - name: Check generated Eggpack workflow drift
        run: |
          python3 scripts/gen-release-workflow-shape.py
          git diff --exit-code -- release/eggpack/workflow-shape.json
          "$RUNNER_TEMP/eggpack/target/debug/eggpack" ci check \
            --workflow-shape release/eggpack/workflow-shape.json \
            --contract release/eggpack/distribution.toml \
            --github-policy release/eggpack/github-policy.json \
            --workflow .github/workflows/release-eggpack.yml
      - name: Exercise product installer delegation
        run: python3 scripts/test-release-installer.py
      - name: Check signing-request verifier syntax
        run: python3 scripts/test-signing-request.py
      - name: Check candidate source and manifest identity binding
        run: python3 scripts/test-release-smoke.py

  native-release-candidate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            zig_archive: zig-x86_64-linux-0.14.1.tar.xz
            zig_sha256: 24aeeec8af16c381934a6cd7d95c807a8cb2cf7df9fa40d359aa884195c4716c
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            zig_archive: zig-aarch64-linux-0.14.1.tar.xz
            zig_sha256: f7a654acc967864f7a050ddacfaa778c7504a0eca8d2b678839c21eea47c992b
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.89.0
      - name: Provision pinned cargo-zigbuild and Zig
        env:
          ZIG_ARCHIVE: ${{ matrix.zig_archive }}
          ZIG_SHA256: ${{ matrix.zig_sha256 }}
        run: |
          cargo install cargo-zigbuild --version 0.23.3 --locked
          curl --fail --location --retry 3 "https://ziglang.org/download/0.14.1/$ZIG_ARCHIVE" --output "$RUNNER_TEMP/zig.tar.xz"
          echo "$ZIG_SHA256  $RUNNER_TEMP/zig.tar.xz" | sha256sum --check --status
          mkdir "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
      - name: Build the exact GNU target at the glibc 2.17 floor
        env:
          TARGET: ${{ matrix.target }}
        run: cargo zigbuild --locked --release --bin wg-basic --target "$TARGET.2.17"
      - name: Execute and qualify the exact native artifact
        env:
          TARGET: ${{ matrix.target }}
        run: |
          binary="target/$TARGET/release/wg-basic"
          python3 scripts/release-smoke.py "$binary"
          bytes="$(stat -c %s "$binary")"
          digest="$(sha256sum "$binary" | cut -d' ' -f1)"
          printf '### %s native release candidate\n\n- Bytes: `%s`\n- SHA-256: `%s`\n' \
            "$TARGET" "$bytes" "$digest" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Preserve exact native artifact for systemd lifecycle qualification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wg-basic-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/wg-basic
          if-no-files-found: error
          retention-days: 7

  system-install-lifecycle-systemd:
    needs: native-release-candidate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.89.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Download the exact native release candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: wg-basic-${{ matrix.target }}
          path: ${{ runner.temp }}/wg-basic-${{ matrix.target }}
      - name: Qualify fresh systemd install, state-preserving uninstall, and reinstall
        env:
          TARGET: ${{ matrix.target }}
        run: |
          sudo chmod 0755 /usr/local/bin
          chmod 0755 "$RUNNER_TEMP/wg-basic-$TARGET/wg-basic"
          sudo -E env "PATH=$PATH" CARGO_HOME=/tmp/wg-basic-root-cargo \
            CARGO_TARGET_DIR="$RUNNER_TEMP/wg-basic-system-install-target" \
            WGB_CANDIDATE_BINARY="$RUNNER_TEMP/wg-basic-$TARGET/wg-basic" \
            cargo test --locked --test system_installation -- --ignored --exact \
              systemd_installation_ownership_reinstall_and_service_credentials \
              --nocapture --test-threads=1
