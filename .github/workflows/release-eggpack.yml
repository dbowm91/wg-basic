name: Eggpack candidate builds
'on':
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact existing tag to stage
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: eggpack-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
  cancel-in-progress: true
jobs:
  preflight:
    runs-on: "ubuntu-24.04"
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.resolve_tag.outputs.source_sha }}
    timeout-minutes: 60
    steps:
      - name: Resolve and validate immutable release source
        id: resolve_tag
        shell: bash
        env:
          EGGPACK_RELEASE_TAG: "${{ inputs.release_tag }}"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: "set -euo pipefail\ntag=\"$EGGPACK_RELEASE_TAG\"\nif [ \"${#tag}\" -gt 255 ] || [ -z \"$tag\" ]; then\n  echo 'release tag is empty or oversized' >&2\n  exit 1\nfi\nif [ \"${#tag}\" -gt 64 ] || [[ ! \"$tag\" =~ ^v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$ ]]; then\n  echo 'release_tag must be a canonical vX.Y.Z stable tag' >&2\n  exit 1\nfi\nexport LC_ALL=C\nversion=\"${tag#v}\"\nIFS='.' read -r major minor patch <<< \"$version\"\nfor component in \"$major\" \"$minor\" \"$patch\"; do\n  if [ \"${#component}\" -gt 20 ] || { [ \"${#component}\" -eq 20 ] && [[ \"$component\" > 18446744073709551615 ]]; }; then\n    echo 'release_tag numeric component is out of range' >&2\n    exit 1\n  fi\ndone\nref=\"refs/tags/$tag\"\ngit check-ref-format \"$ref\"\naskpass=\"$RUNNER_TEMP/eggpack-tag-askpass\"\nverify_repo=\"$RUNNER_TEMP/eggpack-tag-verify.git\"\ntrap 'rm -f -- \"$askpass\"' EXIT\ncat >\"$askpass\" <<'ASKPASS'\n#!/bin/sh\ncase \"$1\" in\n  *Username*) printf '%s\\n' x-access-token ;;\n  *Password*) printf '%s\\n' \"$EGGPACK_GIT_TOKEN\" ;;\n  *) exit 1 ;;\nesac\nASKPASS\nchmod 700 \"$askpass\"\nremote=\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git\"\nrefs=\"$(GIT_ASKPASS=\"$askpass\" GIT_TERMINAL_PROMPT=0 EGGPACK_GIT_TOKEN=\"$GITHUB_TOKEN\" git ls-remote --exit-code \"$remote\" \"$ref\" \"$ref^{}\")\"\ndirect=\npeeled=\nwhile IFS=\"$(printf '\\t')\" read -r oid name; do\n  case \"$name\" in\n    \"$ref\") [ -z \"$direct\" ] || { echo 'duplicate tag ref result' >&2; exit 1; }; direct=\"$oid\" ;;\n    \"$ref^{}\") [ -z \"$peeled\" ] || { echo 'duplicate peeled ref result' >&2; exit 1; }; peeled=\"$oid\" ;;\n    *) echo 'unexpected tag resolution result' >&2; exit 1 ;;\n  esac\ndone <<< \"$refs\"\nsource_sha=\"${peeled:-$direct}\"\nif [[ ! \"$source_sha\" =~ ^[0-9a-f]{40}$ ]]; then\n  echo 'tag did not resolve to one full object OID' >&2\n  exit 1\nfi\ngit init --bare \"$verify_repo\" >/dev/null\nGIT_ASKPASS=\"$askpass\" GIT_TERMINAL_PROMPT=0 EGGPACK_GIT_TOKEN=\"$GITHUB_TOKEN\" git --git-dir=\"$verify_repo\" fetch --no-tags --depth=1 \"$remote\" \"$ref\" >/dev/null\nfetched_commit=\"$(git --git-dir=\"$verify_repo\" rev-parse --verify 'FETCH_HEAD^{commit}')\"\nif [ \"$fetched_commit\" != \"$source_sha\" ]; then\n  echo 'tag did not resolve to the advertised commit object' >&2\n  exit 1\nfi\nprintf 'source_sha=%s\\n' \"$source_sha\" >> \"$GITHUB_OUTPUT\"\n"
      - name: Check out source
        uses: "actions/checkout@11d5960a326750d5838078e36cf38b85af677262"
        with:
          ref: "${{ steps.resolve_tag.outputs.source_sha }}"
      - name: Verify frozen source checkout
        shell: bash
        env:
          EGGPACK_EXPECTED_SOURCE_SHA: "${{ steps.resolve_tag.outputs.source_sha }}"
        run: test "$(git rev-parse --verify HEAD^{commit})" = "$EGGPACK_EXPECTED_SOURCE_SHA"

      - name: Check Cargo availability
        shell: bash
        run: cargo --version
  resolve:
    needs: preflight
    outputs:
      source_sha: ${{ needs.preflight.outputs.source_sha }}
    runs-on: "ubuntu-24.04"
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: "actions/checkout@11d5960a326750d5838078e36cf38b85af677262"
        with:
          ref: "${{ needs.preflight.outputs.source_sha }}"
      - name: Verify frozen source checkout
        shell: bash
        env:
          EGGPACK_EXPECTED_SOURCE_SHA: "${{ needs.preflight.outputs.source_sha }}"
        run: test "$(git rev-parse --verify HEAD^{commit})" = "$EGGPACK_EXPECTED_SOURCE_SHA"

      - name: Install pinned Eggpack tool
        shell: bash
        timeout-minutes: 20
        run: |
          cargo install --git https://github.com/eggstack/eggpack --rev 1103a1affc62a210f1102a769457db80d9188bc8 --locked eggpack-cli
          eggpack --version
      - name: Create runtime identity directory
        shell: bash
        run: "mkdir -p './eggpack-runtime'"
      - name: Resolve runtime release identity
        shell: bash
        env:
          EGGPACK_RELEASE_TAG: "${{ inputs.release_tag }}"
        run: |
          head_sha="$(git rev-parse --verify HEAD^{commit})"
          'eggpack' 'ci' '_resolve-release' '--contract' 'release/eggpack/distribution.toml' '--pack-config' 'release/eggpack/pack.toml' '--build-bindings' 'release/eggpack/build-bindings.toml' '--qualification-bindings' 'release/eggpack/qualification-bindings.toml' '--consumer-validators' 'release/eggpack/consumer-validators.json' '--selected' 'linux-x64,linux-arm64' '--tag' "$EGGPACK_RELEASE_TAG" '--source-revision' "$head_sha" '--template' 'release/eggpack/github-template.json' '--source-root' '${{ github.workspace }}' '--output-plan' './eggpack-runtime/release-plan.json' '--output-ci-plan' './eggpack-runtime/release-ci-plan.json' '--output-github-policy' './eggpack-runtime/github-draft.json' '--identity-mode' 'v_prefixed_stable_semver'
      - name: Upload runtime release identity
        uses: "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02"
        with:
          name: "eggpack-runtime-identity"
          path: "./eggpack-runtime"
          if-no-files-found: error
          retention-days: 7
  build_aarch64_unknown_linux_gnu:
    needs: resolve
    runs-on: "ubuntu-24.04-arm"
    permissions:
      contents: read
    timeout-minutes: 60
    continue-on-error: false
    steps:
      - name: Check out source
        uses: "actions/checkout@11d5960a326750d5838078e36cf38b85af677262"
        with:
          ref: "${{ needs.resolve.outputs.source_sha }}"
      - name: Verify frozen source checkout
        shell: bash
        env:
          EGGPACK_EXPECTED_SOURCE_SHA: "${{ needs.resolve.outputs.source_sha }}"
        run: test "$(git rev-parse --verify HEAD^{commit})" = "$EGGPACK_EXPECTED_SOURCE_SHA"

      - name: Download runtime release identity
        uses: "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093"
        with:
          name: "eggpack-runtime-identity"
          path: "./eggpack-runtime"
          if-no-files-found: error
      - name: Set up Rust toolchain
        uses: "dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c"
        with:
          toolchain: "stable"
          targets: "aarch64-unknown-linux-gnu"
      - name: Install exact cargo-zigbuild
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          install_root="${{ runner.temp }}/eggpack/cargo-install/${{ github.run_id }}-${{ github.run_attempt }}"
          mkdir -p "$install_root"
          CARGO_INSTALL_ROOT="$install_root" cargo install cargo-zigbuild --version '0.23.3' --locked
          echo "CARGO_INSTALL_ROOT=$install_root" >> "$GITHUB_ENV"
          echo "$install_root/bin" >> "$GITHUB_PATH"
          export PATH="$install_root/bin:$PATH"
          test -x "$install_root/bin/cargo-zigbuild"
      - name: Provision verified Zig 0.14.1
        shell: bash
        run: |
          set -euo pipefail
          zig_version='0.14.1'
          zig_archive='zig-aarch64-linux-0.14.1.tar.xz'
          zig_url='https://ziglang.org/download/0.14.1/zig-aarch64-linux-0.14.1.tar.xz'
          zig_sha='f7a654acc967864f7a050ddacfaa778c7504a0eca8d2b678839c21eea47c992b'
          work="${{ runner.temp }}/eggpack/zig/${{ github.run_id }}-${{ github.run_attempt }}"
          mkdir -p "$work"
          archive="$work/$zig_archive"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --proto-redir '=https' --connect-timeout 30 --max-time 600 -o "$archive" "$zig_url"
          printf '%s  %s\n' "$zig_sha" "$archive" | sha256sum --check -
          entries="$(tar -tf "$archive")"
          test -n "$entries"
          if printf '%s\n' "$entries" | grep -Eq '(^/)|(^|/)\.\.(/|$)'; then echo 'rejected Zig archive path' >&2; exit 1; fi
          top="$(printf '%s\n' "$entries" | cut -d/ -f1 | sort -u)"
          test -n "$top"
          test "$(printf '%s\n' "$top" | wc -l)" = "1"
          printf '%s\n' "$entries" | grep -Fxq "$top/zig"
          rm -rf "$work/extract"
          mkdir -p "$work/extract"
          tar -xf "$archive" -C "$work/extract"
          test ! -L "$work/extract/$top/zig"
          test -f "$work/extract/$top/zig"
          test -s "$work/extract/$top/zig"
          test -x "$work/extract/$top/zig"
          zig_bin="$work/extract/$top/zig"
          test "$("$zig_bin" version)" = '0.14.1'
          cache="${{ runner.temp }}/eggpack/zigbuild-cache/${{ github.run_id }}-${{ github.run_attempt }}"
          mkdir -p "$cache"
          echo "CARGO_ZIGBUILD_ZIG_PATH=$zig_bin" >> "$GITHUB_ENV"
          echo "CARGO_ZIGBUILD_CACHE_DIR=$cache" >> "$GITHUB_ENV"
          echo "$work/extract/$top" >> "$GITHUB_PATH"
      - name: Install pinned Eggpack tool
        shell: bash
        timeout-minutes: 20
        run: |
          cargo install --git https://github.com/eggstack/eggpack --rev 1103a1affc62a210f1102a769457db80d9188bc8 --locked eggpack-cli
          eggpack --version
      - name: Verify checked-out release source
        shell: bash
        env:
          EGGPACK_RELEASE_TAG: "${{ inputs.release_tag }}"
        run: "'eggpack' 'ci' '_verify-source' '--release-plan' 'eggpack-runtime/release-plan.json' '--github-policy' 'eggpack-runtime/github-draft.json' '--expected-tag' \"$EGGPACK_RELEASE_TAG\" '--source-root' '${{ github.workspace }}'"
      - name: Build "aarch64-unknown-linux-gnu / wg-basic"
        shell: bash
        env:
          CARGO_TARGET_DIR: "${{ runner.temp }}/eggpack/${{ github.run_id }}-${{ github.run_attempt }}"
          CARGO_ZIGBUILD_ZIG_PATH: ${{ env.CARGO_ZIGBUILD_ZIG_PATH }}
          CARGO_ZIGBUILD_CACHE_DIR: ${{ env.CARGO_ZIGBUILD_CACHE_DIR }}
        run: "'cargo' '+stable' 'zigbuild' '--release' '--locked' '--target' 'aarch64-unknown-linux-gnu.2.17' '--package' 'wg-basic' '--bin' 'wg-basic'"
      - name: Capture canonical build handoff
        shell: bash
        run: "'eggpack' 'ci' '_capture-build' '--release-plan' 'eggpack-runtime/release-plan.json' '--build-bindings' 'release/eggpack/build-bindings.toml' '--target' 'aarch64-unknown-linux-gnu' '--cargo-target-dir' '${{ runner.temp }}/eggpack/${{ github.run_id }}-${{ github.run_attempt }}' '--output-dir' './eggpack-build/build_aarch64_unknown_linux_gnu'"
      - name: Upload canonical build handoff
        uses: "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02"
        with:
          name: "eggpack-build-handoff-aarch64-unknown-linux-gnu"
          path: "./eggpack-build/build_aarch64_unknown_linux_gnu"
          if-no-files-found: error
          retention-days: 7
