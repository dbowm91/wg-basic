        run: "'eggpack' 'ci' '_verify-source' '--release-plan' 'eggpack-runtime/release-plan.json' '--github-policy' 'eggpack-runtime/github-draft.json' '--expected-tag' \"$EGGPACK_RELEASE_TAG\" '--source-root' '${{ github.workspace }}'"
      - name: Build "x86_64-unknown-linux-gnu / wg-basic"
        shell: bash
