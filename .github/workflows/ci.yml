name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update_only:
        description: Run only the destructive distribution updater qualification
        required: false
        type: boolean
        default: false

jobs:
  update-transaction-rootful:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Verify disposable runner network prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 iputils-ping nftables
          sudo modprobe wireguard
          sudo ip link add wgb-c002-probe type wireguard
          sudo ip link delete wgb-c002-probe
      - name: Build the exact release-mode schema-v4 old fixture
        run: |
          mkdir -p "$RUNNER_TEMP/wg-basic-old-src"
          git archive 3e5b21c | tar -x -C "$RUNNER_TEMP/wg-basic-old-src"
          git show ae60e81:src/state/service_lease.rs > "$RUNNER_TEMP/wg-basic-old-src/src/state/service_lease.rs"
          python3 scripts/patch-update-old-fixture.py "$RUNNER_TEMP/wg-basic-old-src/src/main.rs"
          cargo build --locked --release --manifest-path "$RUNNER_TEMP/wg-basic-old-src/Cargo.toml" --bin wg-basic --target-dir "$RUNNER_TEMP/wg-basic-old-target"
          stat -c 'old fixture bytes: %s' "$RUNNER_TEMP/wg-basic-old-target/release/wg-basic"
          sha256sum "$RUNNER_TEMP/wg-basic-old-target/release/wg-basic"
      - name: Build a strictly newer fixture candidate without changing repository history
        run: |
          mkdir -p "$RUNNER_TEMP/wg-basic-candidate-src"
          git archive "$GITHUB_SHA" | tar -x -C "$RUNNER_TEMP/wg-basic-candidate-src"
          sed -i '0,/^version = "0.1.0"$/s//version = "0.1.1"/' "$RUNNER_TEMP/wg-basic-candidate-src/Cargo.toml"
          cargo update --manifest-path "$RUNNER_TEMP/wg-basic-candidate-src/Cargo.toml" -p wg-basic --precise 0.1.1
          cargo build --locked --release --features update-test-fixtures --manifest-path "$RUNNER_TEMP/wg-basic-candidate-src/Cargo.toml" --target-dir "$RUNNER_TEMP/wg-basic-candidate-target" --bin wg-basic
          stat -c 'candidate fixture bytes: %s' "$RUNNER_TEMP/wg-basic-candidate-target/release/wg-basic"
          sha256sum "$RUNNER_TEMP/wg-basic-candidate-target/release/wg-basic"
      - name: Qualify signed-fixture migration rollback, recovery, retry, and real systemd services
        run: |
          sudo chmod 0755 /usr/local/bin
          sudo -E env "PATH=$PATH" CARGO_HOME=/tmp/wg-basic-root-cargo \
            CARGO_TARGET_DIR="$RUNNER_TEMP/wg-basic-rootful-target" \
            WGB_OLD_BINARY="$RUNNER_TEMP/wg-basic-old-target/release/wg-basic" \
            WGB_CANDIDATE_BINARY="$RUNNER_TEMP/wg-basic-candidate-target/release/wg-basic" \
            cargo test --locked --features linux-integration,update-test-fixtures \
              --test update_transaction_rootful -- --ignored --exact \
              signed_systemd_update_rolls_back_and_retries --nocapture --test-threads=1

  dependency-audit:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.update_only != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit the committed dependency lockfile
        run: cargo audit

  upgrade-rehearsal:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.update_only != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Build immutable Phase 8 binary with its own lockfile
        run: |
          git worktree add --detach "$RUNNER_TEMP/wg-basic-phase8" e8fd6b1212491576f3c6bdd7468591a97d5aaf3c
          cargo build --release --locked --manifest-path "$RUNNER_TEMP/wg-basic-phase8/Cargo.toml" --target-dir "$RUNNER_TEMP/wg-basic-phase8-target" --bin wg-basic
      - name: Build labeled candidate binary
        run: cargo build --release --locked --target-dir "$RUNNER_TEMP/wg-basic-candidate-target" --bin wg-basic
      - name: Rehearse v4 migration, old-binary refusal, compatible restore, and re-upgrade
        env:
          WGB_OLD_BINARY: ${{ runner.temp }}/wg-basic-phase8-target/release/wg-basic
          WGB_CANDIDATE_BINARY: ${{ runner.temp }}/wg-basic-candidate-target/release/wg-basic
        run: cargo test --locked --test upgrade_rehearsal -- --ignored --nocapture

  upgrade-rehearsal-rootful:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.update_only != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y iproute2 iputils-ping
      - name: Build immutable Phase 8 binary with its own lockfile
        run: |
          git worktree add --detach "$RUNNER_TEMP/wg-basic-phase8" e8fd6b1212491576f3c6bdd7468591a97d5aaf3c
          cargo build --release --locked --manifest-path "$RUNNER_TEMP/wg-basic-phase8/Cargo.toml" --target-dir "$RUNNER_TEMP/wg-basic-phase8-target" --bin wg-basic
      - name: Build labeled candidate binary
        run: cargo build --release --locked --target-dir "$RUNNER_TEMP/wg-basic-candidate-target" --bin wg-basic
      - name: Rehearse real v4 product traffic, failure, rollback, and re-upgrade
        run: sudo -E env "PATH=$PATH" CARGO_HOME=/tmp/wg-basic-root-cargo CARGO_TARGET_DIR="$RUNNER_TEMP/wg-basic-upgrade-rootful-target" WGB_OLD_BINARY="$RUNNER_TEMP/wg-basic-phase8-target/release/wg-basic" WGB_CANDIDATE_BINARY="$RUNNER_TEMP/wg-basic-candidate-target/release/wg-basic" cargo test --locked --features linux-integration --test upgrade_rehearsal_rootful -- --ignored --nocapture --test-threads=1

  rust:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.update_only != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo check --all-targets --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  system-install-systemd:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.update_only != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Secure the disposable runner's canonical installation parent
        run: sudo chmod 0755 /usr/local/bin
      - name: Qualify native installation, service identities, and exact ownership on the disposable systemd runner
        run: sudo -E env "PATH=$PATH" CARGO_HOME=/tmp/wg-basic-root-cargo cargo test --locked --test system_installation -- --ignored --exact systemd_installation_ownership_reinstall_and_service_credentials --nocapture --test-threads=1

  doctor-readonly:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.update_only != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y iproute2 nftables
      - name: Qualify doctor plan-only diagnostics and host-state preservation
        run: sudo -E env "PATH=$PATH" CARGO_HOME=/tmp/wg-basic-root-cargo cargo test --locked --features linux-integration --test doctor_readonly -- --test-threads=1

  maintenance-rootful:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.update_only != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y iproute2 nftables
      - name: Qualify maintenance disable, restart, and fail-closed purge
        run: sudo -E env "PATH=$PATH" CARGO_HOME=/tmp/wg-basic-root-cargo cargo test --locked --features linux-integration --test maintenance_rootful -- --test-threads=1 --nocapture

  wireguard-kernel:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.update_only != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y iproute2 iputils-ping
      - name: Qualify kernel WireGuard control in isolated namespaces
        run: sudo -E env "PATH=$PATH" CARGO_HOME=/tmp/wg-basic-root-cargo cargo test --locked --features linux-integration --test wireguard_kernel -- --nocapture

  network-reconcile-kernel:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.update_only != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y iproute2
      - name: Qualify link, address, route, and reconciliation in a namespace
        run: sudo -E env "PATH=$PATH" CARGO_HOME=/tmp/wg-basic-root-cargo cargo test --locked --features linux-integration --test network_reconcile -- --nocapture

  network-control-e2e:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.update_only != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y iproute2 iputils-ping nftables
      - name: Qualify WireGuard forwarding, NAT, and firewall ownership
        run: sudo -E env "PATH=$PATH" CARGO_HOME=/tmp/wg-basic-root-cargo cargo test --locked --features linux-integration --test network_control_e2e -- --nocapture

  durable-owner:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.update_only != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y iproute2 nftables
      - name: Qualify durable owner tags and generation-aware aggregate reconcile
        run: sudo -E env "PATH=$PATH" CARGO_HOME=/tmp/wg-basic-root-cargo cargo test --locked --features linux-integration --test durable_owner -- --test-threads=1

  durable-restart:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.update_only != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y iproute2 nftables
      - name: Qualify startup recovery against real processes, SQLite, and the kernel
        run: sudo -E env "PATH=$PATH" CARGO_HOME=/tmp/wg-basic-root-cargo cargo test --locked --features linux-integration --test durable_restart -- --test-threads=1 --nocapture

  durable-backup:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.update_only != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y iproute2 nftables iputils-ping
      - name: Qualify backup, restore, and a restored database driving real traffic
        run: sudo -E env "PATH=$PATH" CARGO_HOME=/tmp/wg-basic-root-cargo cargo test --locked --features linux-integration --test durable_backup -- --test-threads=1 --nocapture

  product-management-rootful:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.update_only != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y iproute2 iputils-ping nftables
      # Phase 8 M001: enabled state changes real kernel authorization, so the
      # enable/disable/re-enable evidence needs a real device and a real backend,
      # not a simulated one. This job also covers the degraded-enforcement claim,
      # which can only be made by actually stopping the backend mid-commit.
      - name: Qualify product management against a real WireGuard device
        run: sudo -E env "PATH=$PATH" CARGO_HOME=/tmp/wg-basic-root-cargo cargo test --locked --features linux-integration --test product_management_rootful -- --test-threads=1 --nocapture
