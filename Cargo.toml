[package]
name = "wg-basic"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
description = "A small Linux-native WireGuard management appliance"

[features]
linux-integration = []

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
ipnet = { version = "2.11", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
uuid = { version = "1.18", features = ["v4", "serde"] }
zeroize = "1.8"

[target.'cfg(target_os = "linux")'.dependencies]
ctrlc = "3.4"
futures-util = "0.3"
nl-wireguard = "0.3.0"
nix = { version = "0.30", features = ["socket", "user"] }
rtnetlink = "0.23.0"
serde_json = "1.0"
tokio = { version = "1.44", features = ["net", "rt", "time"] }
x25519-dalek = { version = "2.0.1", features = ["getrandom", "static_secrets", "zeroize"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[[bin]]
name = "wg-basic"
path = "src/main.rs"
